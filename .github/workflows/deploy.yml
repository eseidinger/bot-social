name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-social-lab
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check backend
        working-directory: backend
        run: |
          uv run --locked --extra test ruff format --check bot_social tests migrations
          uv run --locked --extra test ruff check bot_social tests migrations
          uv run --locked --extra test pytest
      - name: Check frontend
        run: |
          npm --prefix web ci
          npm --prefix web run format:check
          npm --prefix web run lint
          npm --prefix web test
          npm --prefix web run build

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Platform CLI
        run: python -m pip install developer-platform-cli==1.0.0
      - name: Check release configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
          PLATFORM_TOKEN_ENDPOINT: ${{ vars.PLATFORM_TOKEN_ENDPOINT }}
          PLATFORM_CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
          PLATFORM_CLIENT_SECRET: ${{ secrets.PLATFORM_CLIENT_SECRET }}
        run: |
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN PLATFORM_API_URL \
            PLATFORM_TOKEN_ENDPOINT PLATFORM_CLIENT_ID PLATFORM_CLIENT_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured in the lab environment"
              exit 1
            fi
          done
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            eseidinger/bot-social:latest
            eseidinger/bot-social:${{ github.sha }}
      - name: Validate and deploy
        env:
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
          PLATFORM_TOKEN_ENDPOINT: ${{ vars.PLATFORM_TOKEN_ENDPOINT }}
          PLATFORM_CLIENT_ID: ${{ secrets.PLATFORM_CLIENT_ID }}
          PLATFORM_CLIENT_SECRET: ${{ secrets.PLATFORM_CLIENT_SECRET }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          expected="eseidinger/bot-social@${IMAGE_DIGEST}"
          devplat deploy validate --project bot-social \
            --file deployment/application.json --output json > "$RUNNER_TEMP/validation.json"
          jq -e --arg image "$expected" \
            '.valid == true and .images.web == $image and .images.worker == $image' \
            "$RUNNER_TEMP/validation.json"

          revision="$(devplat deploy get --project bot-social --output json |
            jq -er '.etag | sub("^\\\""; "") | sub("\\\"$"; "") | select(test("^[0-9]+$"))')"
          devplat deploy apply --project bot-social --file deployment/application.json \
            --if-match "$revision" --wait --output json

          devplat components list --project bot-social --output json > "$RUNNER_TEMP/components.json"
          jq -e --arg image "$expected" '
            ([.components[].name] | sort) == ["web", "worker"] and
            all(.components[];
              .status.state == "ready" and
              .status.desired_image == $image and
              .status.deployment_image == $image and
              .status.ready_replicas == .status.desired_replicas)
          ' "$RUNNER_TEMP/components.json"
